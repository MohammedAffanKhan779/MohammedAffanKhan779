<text x="544" y="152" font-size="44" fill="#F4F6FA" font-weight="700" letter-spacing="-0.8">Nova</text>
<text x="544" y="208" font-size="24" fill="#F4F6FA" font-weight="400" letter-spacing="0">A local-first personal AI agent. It plans tasks, runs them</text>
<text x="544" y="240" font-size="24" fill="#F4F6FA" font-weight="400" letter-spacing="0">step by step and asks before anything consequential.</text>
<text x="544" y="288" font-size="20" fill="#A9B3C3" font-weight="400" letter-spacing="0">Private, owner of a two-person project, active</text>
<g><rect x="0" y="0" width="512" height="440" rx="0" fill="#222834" stroke="none"/><rect x="0" y="0" width="512" height="56" rx="0" fill="#171B24" stroke="none"/><path d="M0 56H512" fill="none" stroke="#3D4759" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="32" y="40" font-size="24" fill="#F4F6FA" font-weight="700" letter-spacing="0">Task window</text><path d="M54 112V236 M54 236V366" fill="none" stroke="#3D4759" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="54" cy="112" r="15" fill="#101218" stroke="#3D4759" stroke-width="1"/><path d="M47 112l5 5 10-11" fill="none" stroke="#5CC98B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="88" y="120" font-size="24" fill="#F4F6FA" font-weight="400" letter-spacing="0">Plan task</text><circle cx="54" cy="168" r="15" fill="#101218" stroke="#3D4759" stroke-width="1"/><path d="M47 168l5 5 10-11" fill="none" stroke="#5CC98B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="88" y="176" font-size="24" fill="#F4F6FA" font-weight="400" letter-spacing="0">Check allowed tools</text><rect x="32" y="208" width="448" height="104" rx="12" fill="#101218" stroke="#3D4759"/><rect x="32" y="220" width="4" height="80" rx="2" fill="#FFB454" stroke="none"/><circle cx="54" cy="240" r="11" fill="#101218" stroke="#FFB454" stroke-width="2"/><path d="M52 236v8m5-8v8" fill="none" stroke="#FFB454" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="88" y="248" font-size="24" fill="#FFB454" font-weight="700" letter-spacing="0">Needs your approval</text><text x="88" y="280" font-size="24" fill="#A9B3C3" font-weight="400" letter-spacing="0">Approval expires in 5:00</text><circle cx="54" cy="360" r="12" fill="#222834" stroke="#A9B3C3" stroke-width="2"/><text x="88" y="368" font-size="24" fill="#A9B3C3" font-weight="400" letter-spacing="0">Verify and save to journal</text></g>
