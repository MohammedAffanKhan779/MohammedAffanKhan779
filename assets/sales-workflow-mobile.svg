<text x="40" y="288" font-size="28" fill="#F4F6FA" font-weight="400" letter-spacing="0">person. Rules in code set prices, never the AI.</text>
<text x="40" y="336" font-size="28" fill="#A9B3C3" font-weight="400" letter-spacing="0">Private, solo, in development</text>
