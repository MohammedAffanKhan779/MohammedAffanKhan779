<text x="40" y="80" font-size="56" fill="#F4F6FA" font-weight="700" letter-spacing="-1">Nova</text>
<text x="40" y="144" font-size="28" fill="#F4F6FA" font-weight="400" letter-spacing="0">A local-first personal AI agent. It plans tasks,</text>
<text x="40" y="184" font-size="28" fill="#F4F6FA" font-weight="400" letter-spacing="0">runs them step by step and asks before</text>
<text x="40" y="224" font-size="28" fill="#F4F6FA" font-weight="400" letter-spacing="0">anything consequential.</text>
<text x="40" y="272" font-size="28" fill="#A9B3C3" font-weight="400" letter-spacing="0">Private, owner of a two-person project, active</text>
